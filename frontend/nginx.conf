map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ONLYOFFICE 的外部协议：生产在 WAF 后面时，WAF 会带 X-Forwarded-Proto: https，
# 必须透传给 DS（DS 用它拼资源链接），否则 DS 会生成 http:// 链接 ->
# HTTPS 页面里触发混合内容拦截。只认 https，其余一律用本层 $scheme。
map $http_x_forwarded_proto $oo_forwarded_proto {
    default $scheme;
    https    https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 报告生成为同步接口，可能耗时 30s~2min，需放宽读超时
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
    }

    # ONLYOFFICE Document Server —— 官方子路径代理方案
    #
    # 原理：DS 自带的 /etc/nginx/includes/http-common.conf 里有
    #   map $http_x_forwarded_prefix $the_prefix { default $http_x_forwarded_prefix; }
    # 而 ds-docservice.conf 用 $the_scheme://$the_host$the_prefix/... 生成
    # 版本化缓存路径的 302。所以只要透传 X-Forwarded-Prefix，DS 生成的链接
    # 就自带 /onlyoffice 前缀，浏览器再经本层剥前缀转发回 DS，闭环成立。
    #
    # proxy_pass 末尾的斜杠不能省：把 /onlyoffice/xxx 剥成 /xxx 再转给 DS。
    location /onlyoffice/ {
        proxy_pass http://onlyoffice/;

        # $http_host 含端口（$host 不含），DS 拼出来的链接必须带端口，
        # 否则浏览器会打到 80 端口去。
        proxy_set_header Host               $http_host;
        proxy_set_header X-Forwarded-Host   $http_host;
        proxy_set_header X-Forwarded-Proto  $oo_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /onlyoffice;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

        # 编辑器用 WebSocket 做实时协同，不带 Upgrade 必然连不上
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 长连接，默认 60s 超时会把编辑会话掐断
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;

        # DS 自身允许 100m 附件上传，本层要放行同样量级
        client_max_body_size 100m;
    }

    # 带内容哈希的构建产物：文件名变了内容必然变，可以永久缓存。
    # 不设这一条时浏览器会用启发式缓存，部署后用户仍可能跑旧包。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML：必须每次回源校验。它引用着上面那些带哈希的包，
    # 一旦被缓存住，用户就会一直加载旧版本的 index -> 旧版本的代码。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
